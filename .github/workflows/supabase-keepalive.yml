# Supabase 무료 플랜 자동 일시정지(7일 미사용) 방지 — 주 2회 REST 핑으로 활동 유지.
# anon 키는 공개 키(프론트 supabase-config.js에 이미 노출)라 여기 넣어도 안전.
name: supabase-keepalive
on:
  schedule:
    - cron: "0 3 * * 1,4" # 월·목 03:00 UTC (KST 12:00)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (활동 기록)
        run: |
          curl -sS -o /dev/null -w "supabase status: %{http_code}\n" \
            "https://ftgngwqskdniwolatqmv.supabase.co/rest/v1/?apikey=sb_publishable_rTrY4y8q48ex6IPBL16kgw__J7Sunai"
